[versions]
kotlin = "2.4.20"
ksp = "2.3.12"
mockwebserver = "4.12.0"
openai = "4.1.0"
slf4j = "2.0.17"
spotless = "8.10.2"
telegramMarkdownv2 = "1.3.0"
vendeliTelegramBot = "9.6.0"

[libraries]
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp" }
mockwebserver = { module = "com.squareup.okhttp3:mockwebserver", version.ref = "mockwebserver" }
openai-client = { module = "com.aallam.openai:openai-client" }
openai-client-bom = { module = "com.aallam.openai:openai-client-bom", version.ref = "openai" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }
telegram-markdownv2 = { module = "io.github.kamiiroawase:telegram-markdownv2", version.ref = "telegramMarkdownv2" }
vendeli-ktnip = { module = "eu.vendeli:ktnip", version.ref = "vendeliTelegramBot" }
vendeli-telegram-bot = { module = "eu.vendeli:telegram-bot", version.ref = "vendeliTelegramBot" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
